<!-- ==========================================================================
     MADE IN LACE — CARRINHO LATERAL (DRAWER)
     Fidelidade estrita a docs/design/17_MadeInLace Carrinho.png e 22_MadeInLace Carrinho2.png
     WCAG 2.2 AA — Não fecha ao clicar fora, scroll interno nos produtos e cabeçalho/rodapé estáticos.
     ========================================================================== -->

<aside 
    class="cart-drawer" 
    id="cart-drawer" 
    role="dialog" 
    aria-modal="true" 
    aria-labelledby="cart-drawer-title" 
    hidden
>
    <!-- 1. Cabeçalho Estático com Título, Contador, Fechar 'X' e Medidor de Frete Grátis -->
    <header class="cart-drawer__header">
        <div class="cart-drawer__header-row">
            <div class="cart-drawer__title-group">
                <h2 class="cart-drawer__title" id="cart-drawer-title">Seu Carrinho</h2>
                <span class="cart-drawer__count-badge" id="cart-drawer-count" aria-label="Quantidade de itens no carrinho">0</span>
            </div>
            <!-- Botão 'X' no canto superior direito para fechar -->
            <button 
                type="button" 
                class="cart-drawer__close-btn" 
                id="cart-drawer-close-btn" 
                aria-label="Fechar carrinho lateral"
            >&times;</button>
        </div>

        <!-- Bloco Dinâmico do Frete Grátis (R$ 160,00) -->
        <div class="cart-drawer__shipping-box" aria-live="polite">
            <p class="cart-drawer__shipping-message" id="cart-shipping-message">
                Gaste mais R$ 160,00 para ter frete grátis!
            </p>
            <div 
                class="cart-drawer__shipping-meter" 
                role="progressbar" 
                aria-valuemin="0" 
                aria-valuemax="160" 
                aria-valuenow="0" 
                aria-labelledby="cart-shipping-message"
            >
                <div class="cart-drawer__shipping-fill" id="cart-shipping-fill" style="width: 0%;"></div>
            </div>
        </div>
    </header>

    <!-- 2. Área Central Rolável com a Lista de Itens -->
    <div 
        class="cart-drawer__body" 
        id="cart-drawer-items" 
        tabindex="0" 
        role="region" 
        aria-label="Produtos no carrinho"
    >
        <!-- Estado Vazio Inicial -->
        <div class="cart-drawer__empty" id="cart-drawer-empty">
            <div class="cart-drawer__empty-icon" aria-hidden="true">
                <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <path d="M16 10a4 4 0 0 1-8 0"></path>
                </svg>
            </div>
            <p class="cart-drawer__empty-title">Sua sacola está vazia</p>
            <p class="cart-drawer__empty-subtext">Descubra nossas peças exclusivas de corsets, vestidos e saltos e adicione suas favoritas!</p>
            <a href="/produtos" class="cart-drawer__empty-btn" id="cart-drawer-explore-btn">Explorar Peças</a>
        </div>

        <!-- Lista dinâmica de itens renderizada via JavaScript -->
        <ul class="cart-drawer__list" id="cart-drawer-list" aria-live="polite"></ul>
    </div>

    <!-- 3. Rodapé Estático com Barra de Total e Botão 'Ir Para O Pagamento' -->
    <footer class="cart-drawer__footer">
        <!-- Barra escura com 'Total' à esquerda e Preço formatado à direita -->
        <div class="cart-drawer__total-bar">
            <span class="cart-drawer__total-label">Total</span>
            <span class="cart-drawer__total-val" id="cart-drawer-total-val">R$ 0,00</span>
        </div>

        <!-- Alerta de Validação: Adicione Produtos Para Ir Ao Pagamento -->
        <div class="cart-drawer__alert" id="cart-drawer-alert" role="alert" aria-live="assertive" hidden>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span id="cart-drawer-alert-text">Adicione Produtos Para Ir Ao Pagamento</span>
        </div>

        <!-- Botão primário largo linkando para o checkout/pagamento -->
        <a href="/checkout" class="cart-drawer__checkout-btn" id="cart-drawer-checkout-btn">
            IR PARA O PAGAMENTO
        </a>
    </footer>
</aside>
