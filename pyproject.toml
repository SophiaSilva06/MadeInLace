[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".venv",
    "venv",
    ".agent",
    "tools",
    "db",
    "docs"
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"

[tool.mypy]
python_version = "3.12"
exclude = [
    '^.venv/',
    '^.agent/',
    '^tools/'
]
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false
